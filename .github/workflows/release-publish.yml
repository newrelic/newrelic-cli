name: "Release: Publish (Build, Sign & Upload)"
run-name: "Release: Publish ${{ github.ref_name }}"

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW: release-publish.yml
#
# Triggered automatically when a protected v* tag is pushed — which only
# happens as the final step of release-orchestrate.yml.
#
# This workflow handles ALL publishing:
#   • OIL S3 upload (recipes.zip + currentVersion.txt) — if include_oil=true
#   • CLI build, sign, and GitHub Release
#   • CLI S3 upload (install.sh, install.ps1, artifacts, currentVersion.txt)
#   • Windows installer build and signing (called workflow)
#   • Package manager publishing — Chocolatey, Homebrew, etc. (called workflow)
#
# A single OIDC credential exchange at the top of job 1 provides AWS access
# for the entire job. No long-lived AWS keys are used anywhere.
#
# How include_oil is determined:
#   The CLI tag annotation contains `include_oil=true` or `include_oil=false`,
#   written by release-orchestrate.yml. Atomic, immutable, no TOCTOU races.
#
# Re-entrancy / idempotency:
#   If this workflow fails partway through (e.g. S3 upload fails after OIL
#   upload but before CLI upload), re-running it from the same tag is safe:
#   all `aws s3 cp` calls overwrite existing objects, and goreleaser will
#   re-publish the same release assets. No manual cleanup is needed before
#   retrying.
#
# Security controls:
#   • Triggered exclusively by protected v* tags.
#   • AWS credentials are short-lived OIDC tokens (15 min), never stored secrets.
#     OIDC sub claim: repo:newrelic/newrelic-cli:ref:refs/tags/v*
#     Bound to a protected tag push — not an environment label that any future
#     workflow could reuse accidentally.
#   • permissions block follows least-privilege: only what each job needs.
#   • No human can trigger this workflow directly.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

# Least-privilege default — jobs override only what they need.
# id-token: write at workflow level is required so reusable called workflows
# (release-publish-windows.yml) can obtain their own OIDC tokens.
# Per GitHub Actions rules, the caller's top-level permissions cap what called
# workflows can receive — a job-level grant alone is insufficient for callees.
permissions:
  contents: write
  id-token: write

jobs:

  # ── JOB 1: Build, sign and publish ────────────────────────────────────────
  publish:
    name: "Publish: Build, Sign & Upload"
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create GitHub Release + upload assets
      id-token: write    # obtain OIDC token to assume AWS role

    steps:

      # ── SECTION 1: SETUP & OIDC ───────────────────────────────────────────

      - name: "Setup: Install Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: 1.26.x

      - name: "Setup: Add GOBIN to PATH"
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: "Setup: Checkout CLI Tag"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: "Setup: Read include_oil From Tag"
        id: tag_meta
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Read the annotated tag message via the GitHub API rather than git.
          #
          # Why not git? On push: tags: triggered workflows, the runner pre-populates
          # the tag ref (a pointer to a commit SHA) but does NOT fetch the annotated
          # tag object (the blob that holds the message). git tag -l --format='%(contents)'
          # reads from the tag object — so it returns empty even with fetch-tags: true,
          # because fetch --tags pulls refs but the object itself may not transfer
          # depending on the git transport. The GitHub API always returns the tag object
          # directly from GitHub's database, bypassing git entirely. It is authoritative.
          #
          # For annotated tags: GET /git/refs/tags/{tag} returns object.type="tag"
          # and object.sha = the tag object SHA (not the commit SHA).
          # GET /git/tags/{tag_obj_sha} then returns the full tag including .message.
          #
          # For lightweight tags (no annotation): object.type="commit", and
          # GET /git/tags/{commit_sha} returns 404. The || true on RAW handles this
          # gracefully — RAW stays empty, VALUE stays empty, defaults to false.
          TAG="${GITHUB_REF_NAME}"

          REF_RESPONSE=$(curl -sf \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" || true)

          TAG_OBJ_SHA=$(echo "$REF_RESPONSE" | jq -r '.object.sha // ""')
          TAG_OBJ_TYPE=$(echo "$REF_RESPONSE" | jq -r '.object.type // ""')

          RAW=""
          if [ "$TAG_OBJ_TYPE" = "tag" ] && [ -n "$TAG_OBJ_SHA" ]; then
            RAW=$(curl -sf \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJ_SHA}" \
              | jq -r '.message // ""' || true)
          fi

          VALUE=$(echo "$RAW" | grep 'include_oil=' | cut -d= -f2 | tr -d '[:space:]' || true)

          if [ "$VALUE" != "true" ] && [ "$VALUE" != "false" ]; then
            echo "⚠️  include_oil not found in tag annotation — defaulting to false."
            VALUE="false"
          fi

          echo "include_oil=${VALUE}"
          echo "include_oil=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: "Setup: Configure AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_V2 }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          # OIDC sub claim: repo:newrelic/newrelic-cli:ref:refs/tags/<version>
          # Matched by the trust policy on sap-prod-virtuoso-role.

      - name: "Setup: Verify S3 Access"
        run: |
          set -euo pipefail
          if ! aws s3 ls s3://nr-downloads-main/install/newrelic-cli/ > /dev/null 2>&1; then
            echo "❌ Cannot list s3://nr-downloads-main/install/newrelic-cli/"
            echo "   OIDC credential exchange may have failed, or the IAM role lacks s3:ListBucket."
            exit 1
          fi
          echo "✅ CLI S3 access confirmed — OIDC credentials valid."

      # ── SECTION 2: OIL S3 UPLOAD ──────────────────────────────────────────
      # All steps gated on include_oil == 'true'.
      # This runs BEFORE make snapshot / make release-publish. Both call
      # `make recipes`, which reads currentVersion.txt from S3 to decide
      # which recipes.zip to embed into the CLI binary. Uploading here —
      # within the same job, before the build steps — guarantees the CLI
      # binary embeds the correct OIL version.
      # OIDC works here because this workflow is triggered by a v* tag push,
      # so github.ref is refs/tags/v*, matching the trust policy sub-claim.
      # Re-entrancy: all aws s3 cp calls overwrite existing objects, so
      # re-running a failed publish from the same tag is always safe.

      - name: "Publish OIL: Verify OIL Tag Exists"
        if: steps.tag_meta.outputs.include_oil == 'true'
        id: oil_tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "🔍 Verifying tag ${TAG} exists in newrelic/open-install-library..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/newrelic/open-install-library/git/refs/tags/${TAG}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ OIL tag ${TAG} not found (HTTP ${HTTP_CODE})."
            echo "   release-orchestrate.yml did not complete the OIL steps."
            exit 1
          fi
          echo "✅ OIL tag ${TAG} confirmed."
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: "Publish OIL: Download recipes.zip From GitHub Release"
        if: steps.tag_meta.outputs.include_oil == 'true'
        uses: dsaltares/fetch-gh-release-asset@0efe227dedb360b09ea0e533795d584b61c461a9
        with:
          repo: newrelic/open-install-library
          version: "tags/${{ steps.oil_tag.outputs.tag }}"
          file: recipes.zip
          target: recipes.zip
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: "Publish OIL: Upload recipes.zip to S3"
        if: steps.tag_meta.outputs.include_oil == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.oil_tag.outputs.tag }}"
          aws s3 cp recipes.zip \
            "s3://nr-downloads-main/install/open-install-library/${TAG}/recipes.zip"
          echo "✅ recipes.zip uploaded to s3://nr-downloads-main/install/open-install-library/${TAG}/recipes.zip"

      - name: "Publish OIL: Upload currentVersion.txt to S3"
        if: steps.tag_meta.outputs.include_oil == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.oil_tag.outputs.tag }}"
          echo "${TAG}" > currentVersion-oil.txt
          aws s3 cp currentVersion-oil.txt \
            s3://nr-downloads-main/install/open-install-library/currentVersion.txt \
            --cache-control no-cache
          echo "✅ OIL currentVersion.txt updated to ${TAG}."

      - name: "Publish OIL: Verify S3 Artifacts"
        if: steps.tag_meta.outputs.include_oil == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.oil_tag.outputs.tag }}"

          S3_VERSION=$(aws s3 cp \
            s3://nr-downloads-main/install/open-install-library/currentVersion.txt \
            - --quiet | tr -d '[:space:]')
          if [ "$S3_VERSION" != "$TAG" ]; then
            echo "❌ currentVersion.txt mismatch: S3 has '${S3_VERSION}', expected '${TAG}'"
            exit 1
          fi
          if ! aws s3 ls \
            "s3://nr-downloads-main/install/open-install-library/${TAG}/recipes.zip" \
            > /dev/null 2>&1; then
            echo "❌ recipes.zip not found at s3://nr-downloads-main/install/open-install-library/${TAG}/recipes.zip"
            exit 1
          fi
          echo "✅ OIL S3 verified — make recipes will embed ${TAG} when the CLI build runs."

      # ── SECTION 3: CLI BUILD & PUBLISH ────────────────────────────────────

      - name: "Publish CLI: Clean OIL Temp Files"
        run: |
          # recipes.zip and currentVersion-oil.txt are written to the repo root
          # by the OIL S3 upload steps above. goreleaser's dirty-tree check treats
          # any untracked file as a hard error, so remove them before the build.
          rm -f recipes.zip currentVersion-oil.txt
          echo "✅ OIL temp files removed."

      - name: "Publish CLI: Import PGP Signing Key"
        shell: bash
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
        run: |
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          echo "✅ PGP key imported."

      - name: "Publish CLI: Login to Docker Hub"
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "✅ Docker Hub login successful."

      - name: "Publish CLI: Configure Git Identity"
        run: |
          set -euo pipefail
          git config --global user.name  "${{ secrets.NEW_RELIC_GITHUB_SERVICE_ACCOUNT_USERNAME }}"
          git config --global user.email "${{ secrets.NEW_RELIC_GITHUB_SERVICE_ACCOUNT_EMAIL }}"
          git config core.fileMode false
          echo "✅ Git identity configured."

      - name: "Publish CLI: Validate Build (Snapshot)"
        run: |
          set -euo pipefail
          # Runs goreleaser with --snapshot --skip=publish --clean.
          # This builds every binary target (linux/mac/windows/arm/etc) and
          # validates the full goreleaser config and recipe embed — but publishes
          # nothing. Any compile error, goreleaser config mistake, or recipe fetch
          # failure surfaces here and stops the workflow before goreleaser release
          # creates a live GitHub Release.
          #
          # Why this matters: goreleaser v2 creates GitHub Releases as non-draft
          # (publicly visible) immediately. If goreleaser release fails mid-upload,
          # users see a partial release until it is manually cleaned up. This step
          # acts as a hard gate: if the build is broken, we fail fast before any
          # public artifact is created.
          #
          # The output of this step is intentionally discarded — make release-publish
          # (next step) runs its own clean + rebuild from scratch. The value is
          # validation, not artifact reuse.
          make snapshot
          echo "✅ Build validated — no compile errors, goreleaser config is valid."

      - name: "Publish CLI: Run Goreleaser"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/win_metadata.sh scripts/win_metadata_files_remove.sh
          ./scripts/win_metadata.sh
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          go generate cmd/newrelic/main.go
          make release-publish
          ./scripts/win_metadata_files_remove.sh
          echo "✅ Release published via goreleaser."

      - name: "Publish CLI: Sign Windows Binary"
        shell: bash
        env:
          PFX_CONTENT: ${{ secrets.PFX_BASE64_CONTENT }}
          PFX_PASSWORD: ${{ secrets.PFX_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$PFX_CONTENT" | base64 -d > cert.pfx
          sudo apt-get install osslsigncode -y -q
          sudo mv dist/newrelic_windows_amd64_v1/newrelic.exe \
                  dist/newrelic_windows_amd64_v1/newrelic-unsigned.exe
          osslsigncode sign -pkcs12 cert.pfx -pass "$PFX_PASSWORD" -h sha256 \
            -t http://timestamp.digicert.com \
            -in  dist/newrelic_windows_amd64_v1/newrelic-unsigned.exe \
            -out dist/newrelic_windows_amd64_v1/newrelic.exe
          rm -f cert.pfx dist/newrelic_windows_amd64_v1/newrelic-unsigned.exe
          echo "✅ Windows binary signed."

      - name: "Publish CLI: Upload Windows Binary Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-binary
          path: dist/newrelic_windows_amd64_v1/newrelic.exe

      - name: "Publish CLI: Repackage Windows Zip"
        run: |
          set -euo pipefail
          VERSION=$(ls dist/*Windows_x86_64.zip | cut -d_ -f2)
          rm -f "dist/newrelic-cli_${VERSION}_Windows_x86_64.zip"
          zip -q "dist/newrelic-cli_${VERSION}_Windows_x86_64.zip" \
                 dist/newrelic_windows_amd64_v1/newrelic.exe
          echo "✅ Windows zip re-packaged with signed binary."

      - name: "Publish CLI: Get Latest Tag"
        id: get-latest-tag
        uses: actions-ecosystem/action-get-latest-tag@b7c32daec3395a9616f88548363a42652b22d435  # v1

      - name: "Publish CLI: Get Release Upload URL"
        id: get-upload-url
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_URL=$(./scripts/get_latest_release_upload_url.sh)
          echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: "Publish CLI: Generate and Sign Checksums"
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_FILE=$(find dist -name "newrelic-cli_*_checksums.txt")
          if [ -z "$CHECKSUM_FILE" ]; then
            echo "❌ Checksum file not found in dist/"
            exit 1
          fi

          cp "$CHECKSUM_FILE" dist/checksums_sha256.txt

          gpg --batch --yes -u "4F9A9B5B96EC30B9" \
              --output dist/checksums_sha256.txt.sig \
              --detach-sign dist/checksums_sha256.txt

          echo "✅ Checksums generated and signed."

      - name: "Publish CLI: Upload Checksums to GitHub Release"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          UPLOAD_URL: ${{ steps.get-upload-url.outputs.upload_url }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o /tmp/upload-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: text/plain" \
            "${UPLOAD_URL}?name=checksums_sha256.txt" \
            --data-binary @./dist/checksums_sha256.txt)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Upload failed (HTTP ${HTTP_CODE}):"
            cat /tmp/upload-response.json
            exit 1
          fi
          echo "✅ checksums_sha256.txt uploaded."

      - name: "Publish CLI: Verify Checksums Upload"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          UPLOAD_URL: ${{ steps.get-upload-url.outputs.upload_url }}
        run: |
          set -euo pipefail
          ASSET_NAME="checksums_sha256.txt"
          RELEASE_ID=$(echo "$UPLOAD_URL" | grep -oE 'releases/[0-9]+' | grep -oE '[0-9]+')

          ASSETS=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/newrelic/newrelic-cli/releases/${RELEASE_ID}/assets")

          CREATED_AT=$(echo "$ASSETS" | jq -r --arg name "$ASSET_NAME" \
            '.[] | select(.name == $name) | .created_at')

          if [ -z "$CREATED_AT" ] || [ "$CREATED_AT" = "null" ]; then
            echo "❌ Asset '${ASSET_NAME}' not found in release ${RELEASE_ID}"
            exit 1
          fi

          NOW=$(date -u +%s)
          UPLOADED_AT=$(date -u -d "${CREATED_AT}" +%s)
          AGE=$(( NOW - UPLOADED_AT ))

          echo "Asset   : ${ASSET_NAME}"
          echo "Uploaded: ${CREATED_AT}"
          echo "Age     : ${AGE}s"

          if [ "$AGE" -ge 120 ]; then
            echo "❌ Asset age ${AGE}s >= 120s — this is a stale asset, not the one just uploaded"
            exit 1
          fi
          echo "✅ Asset verified — uploaded ${AGE}s ago"

      - name: "Publish CLI: Upload Checksum Signature to GitHub Release"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          UPLOAD_URL: ${{ steps.get-upload-url.outputs.upload_url }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o /tmp/upload-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: text/plain" \
            "${UPLOAD_URL}?name=checksums_sha256.txt.sig" \
            --data-binary @./dist/checksums_sha256.txt.sig)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Upload failed (HTTP ${HTTP_CODE}):"
            cat /tmp/upload-response.json
            exit 1
          fi
          echo "✅ checksums_sha256.txt.sig uploaded."

      - name: "Publish CLI: Verify Checksum Signature Upload"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          UPLOAD_URL: ${{ steps.get-upload-url.outputs.upload_url }}
        run: |
          set -euo pipefail
          ASSET_NAME="checksums_sha256.txt.sig"
          RELEASE_ID=$(echo "$UPLOAD_URL" | grep -oE 'releases/[0-9]+' | grep -oE '[0-9]+')

          ASSETS=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/newrelic/newrelic-cli/releases/${RELEASE_ID}/assets")

          CREATED_AT=$(echo "$ASSETS" | jq -r --arg name "$ASSET_NAME" \
            '.[] | select(.name == $name) | .created_at')

          if [ -z "$CREATED_AT" ] || [ "$CREATED_AT" = "null" ]; then
            echo "❌ Asset '${ASSET_NAME}' not found in release ${RELEASE_ID}"
            exit 1
          fi

          NOW=$(date -u +%s)
          UPLOADED_AT=$(date -u -d "${CREATED_AT}" +%s)
          AGE=$(( NOW - UPLOADED_AT ))

          echo "Asset   : ${ASSET_NAME}"
          echo "Uploaded: ${CREATED_AT}"
          echo "Age     : ${AGE}s"

          if [ "$AGE" -ge 120 ]; then
            echo "❌ Asset age ${AGE}s >= 120s — this is a stale asset, not the one just uploaded"
            exit 1
          fi
          echo "✅ Asset verified — uploaded ${AGE}s ago"

      - name: "Publish CLI: Write currentVersion.txt"
        run: |
          set -euo pipefail
          echo "${{ steps.get-latest-tag.outputs.tag }}" > currentVersion.txt
          echo "✅ currentVersion.txt written: ${{ steps.get-latest-tag.outputs.tag }}"

      - name: "Publish CLI: Upload install.sh to S3"
        run: |
          set -euo pipefail
          aws s3 cp ./scripts/install.sh \
            s3://nr-downloads-main/install/newrelic-cli/scripts/install.sh
          echo "✅ install.sh uploaded."

      - name: "Publish CLI: Upload currentVersion.txt to S3"
        run: |
          set -euo pipefail
          aws s3 cp currentVersion.txt \
            s3://nr-downloads-main/install/newrelic-cli/currentVersion.txt \
            --cache-control no-cache
          echo "✅ CLI currentVersion.txt updated to ${{ steps.get-latest-tag.outputs.tag }}."

      - name: "Publish CLI: Upload Release Artifacts to S3"
        run: |
          set -euo pipefail
          TAG="${{ steps.get-latest-tag.outputs.tag }}"
          aws s3 cp --recursive \
            --exclude "*" \
            --include "newrelic-cli_*.txt" \
            --include "newrelic-cli_*.sig" \
            --include "newrelic-cli_*.zip" \
            --include "newrelic-cli_*.gz" \
            --include "newrelic-cli_*.rpm" \
            --include "newrelic-cli_*.deb" \
            --include "newrelic_*" \
            ./dist \
            "s3://nr-downloads-main/install/newrelic-cli/${TAG}/"
          echo "✅ CLI release artifacts uploaded to S3 at install/newrelic-cli/${TAG}/"

  # ── JOB 2: Windows installer ───────────────────────────────────────────────
  release-windows-installer:
    name: "Publish: Windows Installer"
    needs: publish
    uses: newrelic/newrelic-cli/.github/workflows/release-windows-installer.yml@main
    secrets:
      PFX_BASE64_CONTENT: ${{ secrets.PFX_BASE64_CONTENT }}
      PFX_CERT_PASSWORD: ${{ secrets.PFX_CERT_PASSWORD }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # ── JOB 3: Package managers ────────────────────────────────────────────────
  publish-packages:
    name: "Publish: Package Managers"
    needs: release-windows-installer
    uses: newrelic/newrelic-cli/.github/workflows/release-publish-windows.yml@main
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      DEV_TOOLKIT_TOKEN: ${{ secrets.DEV_TOOLKIT_TOKEN }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_V2 }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

  # ── JOB 4: Docker snapshot (newrelic/cli:latest) ───────────────────────────
  snapshot:
    name: "Publish: Docker Snapshot"
    needs: publish
    uses: newrelic/newrelic-cli/.github/workflows/snapshot.yml@main
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
