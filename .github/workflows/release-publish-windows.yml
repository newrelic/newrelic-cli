name: Release - Homebrew

# id-token: write is required so this called workflow can obtain its own
# OIDC token for the AWS credential exchange. The caller (release-publish.yml)
# must grant id-token: write at workflow level for this to propagate here.
permissions:
  contents: write
  id-token: write

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: true
      DEV_TOOLKIT_TOKEN:
        required: true
      CHOCOLATEY_API_KEY:
        required: true
      AWS_ROLE_ARN:
        required: true
      AWS_DEFAULT_REGION:
        required: true

jobs:
  release-windows:
    name: Publish Windows Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Output latest tag
        id: latest-tag
        run: |
          tag=$(git describe --tags --abbrev=0)

          echo " "
          echo "Latest tag - before: ${tag}"
          echo " "

          git fetch origin
          git fetch --tags

          latestTag=$(git describe --tags --abbrev=0)

          echo " "
          echo "Latest tag - after:  ${latestTag}"
          echo " "

          echo '::set-output name=NEW_RELIC_CLI_VERSION::${latestTag}'

      - name: Install aws cli
        run: |
          sudo apt-get install -y awscli

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # action-get-latest-tag runs git fetch --tags internally which rejects
          # the tag ref already present on push: tags: runners ("would clobber existing tag").
          # This is a called workflow triggered after a tag push — GITHUB_REF_NAME
          # is the triggering tag, available via the caller's context.
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Fetch Github Release Asset - NewRelicCLIInstaller.msi
        uses: dsaltares/fetch-gh-release-asset@0efe227dedb360b09ea0e533795d584b61c461a9  # 0.06
        with:
          repo: "newrelic/newrelic-cli"
          version: "tags/${{ steps.get-latest-tag.outputs.tag }}"
          file: "NewRelicCLIInstaller.msi"
          target: "NewRelicCLIInstaller.msi"
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload Windows install script to AWS S3
        id: upload-install-script-windows
        run: |
          aws s3 cp ./scripts/install.ps1 s3://nr-downloads-main/install/newrelic-cli/scripts/install.ps1

      - name: Upload Windows MSI
        id: upload-windows-msi
        run: |
          aws s3 cp NewRelicCLIInstaller.msi s3://nr-downloads-main/install/newrelic-cli/${{ steps.get-latest-tag.outputs.tag }}/NewRelicCLIInstaller.msi

      - name: Create currentVersion.txt
        id: create-current-version
        run: |
          echo "${{ steps.get-latest-tag.outputs.tag }}" > currentVersion.txt

      - name: Upload currentVersion.txt
        id: upload-current-version
        run: |
          aws s3 cp currentVersion.txt s3://nr-downloads-main/install/newrelic-cli/currentVersion.txt --cache-control no-cache

      - name: Upload chocolatey package
        shell: bash
        continue-on-error: true
        run: make chocolatey-publish
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
