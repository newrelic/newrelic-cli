name: "🪟 Release: Windows Package Manager Publish"

# ─────────────────────────────────────────────────────────────────────────────
# Called by A2 (release-publish.yml) after the Windows installer is built.
# Publishes install.ps1, the MSI, and currentVersion.txt to S3, and pushes
# the Chocolatey package.
#
# Security controls:
#   • AWS credentials are short-lived OIDC tokens minted by the calling
#     workflow (A2), which runs only from a protected v* tag.
#   • Long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are NOT accepted.
#   • All GitHub Actions are pinned to immutable commit SHAs (Req 4).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: true
      DEV_TOOLKIT_TOKEN:
        required: true
      CHOCOLATEY_API_KEY:
        required: true
      AWS_ROLE_ARN:
        required: true
      AWS_DEFAULT_REGION:
        required: true

# id-token: write is required for OIDC credential exchange.
permissions:
  id-token: write
  contents: read

jobs:
  release-windows:
    name: "🪟 Publish Windows artifacts"
    runs-on: ubuntu-latest
    steps:
      - name: "🔍 Checkout"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: "🔢 Get latest tag"
        id: get-latest-tag
        uses: actions-ecosystem/action-get-latest-tag@b7c32daec3395a9616f88548363a42652b22d435  # v1

      - name: "🔒 Configure AWS credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: "🔧 Install AWS CLI"
        run: sudo snap install aws-cli --classic

      - name: "📥 Fetch Windows MSI from GitHub release"
        uses: dsaltares/fetch-gh-release-asset@0efe227dedb360b09ea0e533795d584b61c461a9  # 0.06
        with:
          repo: "newrelic/newrelic-cli"
          version: "tags/${{ steps.get-latest-tag.outputs.tag }}"
          file: "NewRelicCLIInstaller.msi"
          target: "NewRelicCLIInstaller.msi"
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: "☁️ Upload install.ps1 to S3"
        run: |
          aws s3 cp ./scripts/install.ps1 \
            s3://nr-downloads-main/install/newrelic-cli/scripts/install.ps1
          echo "✅ install.ps1 uploaded."

      - name: "☁️ Upload Windows MSI to S3"
        run: |
          aws s3 cp NewRelicCLIInstaller.msi \
            s3://nr-downloads-main/install/newrelic-cli/${{ steps.get-latest-tag.outputs.tag }}/NewRelicCLIInstaller.msi
          echo "✅ MSI uploaded."

      - name: "📝 Write currentVersion.txt"
        run: echo "${{ steps.get-latest-tag.outputs.tag }}" > currentVersion.txt

      - name: "☁️ Upload currentVersion.txt to S3"
        run: |
          aws s3 cp currentVersion.txt \
            s3://nr-downloads-main/install/newrelic-cli/currentVersion.txt \
            --cache-control no-cache
          echo "✅ currentVersion.txt updated."

      - name: "🍫 Publish Chocolatey package"
        shell: bash
        continue-on-error: true
        run: make chocolatey-publish
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
